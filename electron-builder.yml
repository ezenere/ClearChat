appId: com.clearchat.app
productName: ClearChat
copyright: Copyright © 2026 Eduardo Zenere
directories:
  buildResources: build
  output: dist
artifactName: ClearChat-${version}-${arch}.${ext}
compression: maximum
files:
  # Lista de inclusão: só o necessário em runtime — out/ (main/preload/renderer), resources/ e
  # package.json. Repetida em linux/win/mac (o `files` da plataforma substitui esta). O
  # electron-builder acrescenta sozinho os node_modules de produção. (Uma lista de exclusão
  # deixava passar .git e .claude/worktrees, as cópias de trabalho dos agentes.)
  - out/**
  - resources/**
  - package.json
  - '!**/*.{map,ts,tsx,md,markdown}'
  - '!**/{test,tests,__tests__,example,examples,docs,.github}{,/**}'
  - '!node_modules/better-sqlite3/{deps,src,build,binding.gyp}{,/**}'
  # headers de compilação (o better-sqlite3 usa os binários de prebuilds/)
  - '!node_modules/node-addon-api{,/**}'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
  # módulos nativos do áudio local: o `.node` e as libs que ele carrega (libonnxruntime.so…)
  # precisam existir no disco — dentro do app.asar o dlopen não os enxerga
  - node_modules/onnxruntime-node/**
  - node_modules/@napi-rs/whisper-*/**
npmRebuild: false
# Só os idiomas da UI do Chromium que importam (pt-BR + fallback en-US): ~40 MB a menos.
electronLanguages:
  - pt-BR
  - en-US

linux:
  executableName: clearchat
  # ATENÇÃO: o `files` por plataforma SUBSTITUI a lista de cima (não se soma) — por isso cada
  # plataforma repete a lista de inclusão inteira e exclui só os binários das outras.
  # (Sem isso o pacote levava src/, e2e/, docs/, scripts/… — verificado no app.asar.)
  files:
    - out/**
    - resources/**
    - package.json
    - '!**/*.{map,ts,tsx,md,markdown}'
    - '!**/{test,tests,__tests__,example,examples,docs,.github}{,/**}'
    - '!node_modules/better-sqlite3/{deps,src,build,binding.gyp}{,/**}'
    - '!node_modules/node-addon-api{,/**}'
    - '!node_modules/better-sqlite3/prebuilds/{darwin,win32}-*'
    # onnxruntime-node (motor local de fala): só os binários do Linux, e só o provider de CPU —
    # os providers CUDA/TensorRT (~270 MB, baixados pelo postinstall do pacote) nunca são usados
    # (a sessão é criada com executionProviders: ['cpu']). Para nem baixá-los: `ONNXRUNTIME_NODE_INSTALL=skip npm ci`
    # (um .npmrc com a chave faz o npm avisar "Unknown project config" em todo comando).
    - '!node_modules/onnxruntime-node/bin/napi-v6/{darwin,win32}{,/**}'
    - '!node_modules/onnxruntime-node/bin/napi-v6/linux/*/libonnxruntime_providers_*'
    # só a arquitetura do build (${arch} é expandido pelo electron-builder — x64/arm64)
    - '!node_modules/onnxruntime-node/bin/napi-v6/linux/!(${arch}){,/**}'
  # clearchat.desktop + StartupWMClass=clearchat, iguais ao app_id/WM_CLASS da janela
  # (package.json "desktopName"), para o dock agrupar as janelas no ícone certo.
  syncDesktopName: true
  icon: build/icons
  category: Development;
  synopsis: Chat desktop minimalista para endpoints OpenAI-compatible
  # Também vira o Comment do .desktop (o electron-builder usa a description para ele).
  description: Chat minimalista com IA para qualquer endpoint OpenAI-compatible (OpenRouter, OpenAI, servidores locais)
  maintainer: Eduardo Zenere
  vendor: Eduardo Zenere
  target:
    - AppImage
    - deb
    - pacman
    - tar.gz
  desktop:
    entry:
      Name: ClearChat
      GenericName: Chat com IA
      Keywords: ai;ia;chat;llm;openai;openrouter;assistente;
      StartupWMClass: clearchat
      StartupNotify: 'true'
appImage:
  # AppImage de uma arquitetura só (x64): o nome já inclui ${arch}.
  artifactName: ClearChat-${version}-${arch}.${ext}
deb:
  packageCategory: devel
  priority: optional
pacman:
  packageCategory: devel
  # A lista padrão do electron-builder inclui pacotes que não existem mais nos repositórios do
  # Arch (http-parser, libappindicator-gtk3) e quebraria o `pacman -U`. O Electron já traz o resto.
  depends:
    - gtk3
    - nss
    - alsa-lib
    - libxss
    - libxtst
    - libnotify
    - xdg-utils

win:
  executableName: clearchat
  files:
    - out/**
    - resources/**
    - package.json
    - '!**/*.{map,ts,tsx,md,markdown}'
    - '!**/{test,tests,__tests__,example,examples,docs,.github}{,/**}'
    - '!node_modules/better-sqlite3/{deps,src,build,binding.gyp}{,/**}'
    - '!node_modules/node-addon-api{,/**}'
    - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*'
    - '!node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}{,/**}'
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: ClearChat-${version}-setup-${arch}.${ext}
  shortcutName: ClearChat
  uninstallDisplayName: ClearChat

mac:
  icon: build/icon.icns
  files:
    - out/**
    - resources/**
    - package.json
    - '!**/*.{map,ts,tsx,md,markdown}'
    - '!**/{test,tests,__tests__,example,examples,docs,.github}{,/**}'
    - '!node_modules/better-sqlite3/{deps,src,build,binding.gyp}{,/**}'
    - '!node_modules/node-addon-api{,/**}'
    - '!node_modules/better-sqlite3/prebuilds/{win32,linux,linuxmusl}-*'
    - '!node_modules/onnxruntime-node/bin/napi-v6/{win32,linux}{,/**}'
  category: public.app-category.developer-tools
  entitlementsInherit: build/entitlements.mac.plist
  # Ditado e chamada de voz: com o Hardened Runtime, sem a entitlement audio-input
  # (build/entitlements.mac.plist) o macOS nega o microfone em silêncio, sem perguntar.
  extendInfo:
    NSMicrophoneUsageDescription: O ClearChat usa o microfone para o ditado e as chamadas de voz.
  notarize: false
  target:
    - dmg
dmg:
  artifactName: ClearChat-${version}-${arch}.${ext}
